name: Variables and Secrets
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure:
    runs-on: ubuntu-latest
    steps:
      - name: Display configuration
        env:
          APP: ${{ vars.APP_NAME }}
          TEST_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "App name: $APP"
          echo "Secret value: $TEST_SECRET"

      - name: Check built-in token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then echo "GITHUB_TOKEN is available"; fi
